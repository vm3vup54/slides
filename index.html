<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>簡報分享</title>
<meta name="description" content="單一 HTML 檔的互動簡報，點開就能播放。">
<meta property="og:title" content="簡報分享">
<meta property="og:description" content="單一 HTML 檔的互動簡報，點開就能播放。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2313865E'/%3E%3Crect x='7' y='9' width='18' height='12' rx='2' fill='none' stroke='white' stroke-width='2.4'/%3E%3Cpath d='M16 21v4M12 25h8' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --g:#13865E;--gd:#0E6B4A;--g-soft:#E7F3EC;
  --ink:#141A17;--ink2:#3D4842;--mute:#68746E;--line:#E2E7E4;
  --bg:#F7F8F7;--card:#FFFFFF;
  --f:"Noto Sans TC","PingFang TC","Microsoft JhengHei","微軟正黑體",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html{scroll-padding-top:96px}
body{margin:0;font-family:var(--f);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit}
/* 文字樣式（對應 Tailwind 字級） */
.heading-1{font-size:60px;line-height:60px;font-weight:600;letter-spacing:-.01em}
.heading-6{font-size:20px;line-height:28px;font-weight:600}
.title-1{font-size:20px;line-height:28px;font-weight:500}
.title-4{font-size:14px;line-height:20px;font-weight:500}
.body-3{font-size:16px;line-height:24px;font-weight:400}
.body-6{font-size:14px;line-height:20px;font-weight:400}
.button-sm{font-size:14px;line-height:20px;font-weight:600}
.caption-3{font-size:12px;line-height:16px;font-weight:600}
.caption-4{font-size:12px;line-height:16px;font-weight:500}
h1,h2,h3,p{margin:0;text-wrap:balance}
p{text-wrap:pretty}

.skip{position:absolute;left:16px;top:-48px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:8px;text-decoration:none;z-index:20;transition:transform .3s var(--ease)}
.skip:focus{transform:translateY(64px)}

/* 浮動導覽列 */
.nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:16px;padding:8px 8px 8px 16px;border-radius:9999px;background:rgba(255,255,255,.72);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 0 0 1px rgba(20,26,23,.06),0 8px 24px -12px rgba(20,26,23,.18);white-space:nowrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none}
.brand svg{width:24px;height:24px}
.count{padding:4px 12px;border-radius:9999px;background:var(--g-soft);color:var(--gd)}

/* 主視覺 */
main{max-width:1120px;margin:0 auto;padding:0 24px}
.hero{padding:160px 0 64px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--gd);margin-bottom:24px}
.eyebrow i{width:8px;height:8px;border-radius:9999px;background:var(--g)}
.hero h1{max-width:680px;margin:0 auto;background:linear-gradient(90deg,#000 0%,#666 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{max-width:680px;margin:24px auto 0;color:var(--ink2)}
.keys{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 16px;margin-top:24px;color:var(--mute)}
kbd{display:inline-block;min-width:24px;padding:2px 8px;margin:0 4px;border-radius:6px;background:var(--card);box-shadow:0 0 0 1px var(--line),0 2px 0 var(--line);font:inherit;color:var(--ink2);text-align:center}

/* 搜尋 */
.search{position:relative;display:block;max-width:480px;margin:40px auto 0}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mute);pointer-events:none}
.search input{width:100%;height:48px;padding:12px 16px 12px 48px;border:0;border-radius:9999px;background:var(--card);box-shadow:0 0 0 1px var(--line);font:inherit;font-size:16px;color:var(--ink);transition:box-shadow .3s var(--ease)}
.search input::placeholder{color:var(--mute)}
.search input:focus{outline:none;box-shadow:0 0 0 2px var(--g),0 0 0 6px var(--g-soft)}

/* 卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,352px));justify-content:center;gap:24px;padding-bottom:96px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:24px;padding:8px;box-shadow:0 0 0 1px var(--line);transition:transform .5s var(--ease),box-shadow .3s var(--ease)}
.card:hover{transform:translateY(-4px);box-shadow:0 0 0 1px var(--line),0 24px 48px -24px rgba(14,107,74,.35)}
.card:has(.open:focus-visible){box-shadow:0 0 0 2px var(--g),0 0 0 6px var(--g-soft)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#EEF2EF}
.thumb iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none;opacity:0;transition:opacity .5s var(--ease)}
.thumb iframe.ready{opacity:1}
.thumb .sk{position:absolute;inset:0;background:linear-gradient(90deg,#EEF2EF 0%,#F6F8F7 50%,#EEF2EF 100%);background-size:200% 100%;animation:sk 1.4s var(--ease) infinite}
@keyframes sk{to{background-position:-200% 0}}
.body{display:flex;flex-direction:column;gap:8px;padding:16px 16px 12px;flex:1}
.meta{display:flex;align-items:center;gap:8px;color:var(--mute)}
.meta .dot{width:4px;height:4px;border-radius:9999px;background:currentColor;opacity:.5}
.card h2{color:var(--ink)}
.card p{color:var(--mute)}
.open{text-decoration:none;outline:none}
.open::after{content:"";position:absolute;inset:0;border-radius:24px}
.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px 8px 16px;margin-top:auto}
.go{display:inline-flex;align-items:center;gap:4px;color:var(--gd)}
.go svg{width:16px;height:16px;transition:transform .5s var(--ease)}
.card:hover .go svg{transform:translateX(4px)}
.copy{position:relative;z-index:1;display:inline-flex;align-items:center;gap:4px;padding:8px 12px;border:0;border-radius:9999px;background:transparent;color:var(--ink2);cursor:pointer;font-family:inherit;transition:background-color .3s var(--ease),transform .3s var(--ease)}
.copy svg{width:16px;height:16px}
.copy:hover{background:var(--g-soft);color:var(--gd)}
.copy:active{transform:scale(.98)}
.copy:focus-visible{outline:2px solid var(--g);outline-offset:2px}

/* 空狀態 */
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:64px 24px;border-radius:24px;background:var(--card);box-shadow:0 0 0 1px var(--line);text-align:center;color:var(--mute)}
.empty svg{width:32px;height:32px;color:var(--g);margin-bottom:8px}
.empty b{color:var(--ink)}

/* 提示 */
.toast{position:fixed;left:50%;bottom:24px;z-index:30;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);padding:12px 16px;border-radius:16px;word-break:break-all;background:var(--ink);color:#fff;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:transform .5s var(--ease),opacity .3s var(--ease)}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast svg{flex:none;width:16px;height:16px;color:#7FD3A8}
.toast.err svg{display:none}

footer{border-top:1px solid var(--line);padding:32px 24px 48px;text-align:center;color:var(--mute)}

/* 進場 */
.rv{opacity:0;transform:translateY(32px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}

@media (max-width:640px){
  .heading-1{font-size:36px;line-height:40px}
  .hero{padding:128px 0 48px}
  .lead br{display:none}
  .grid{grid-template-columns:1fr}
  .nav{gap:8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important}
  .rv{transform:none}
  .card:hover{transform:none}
}
</style>
</head>
<body>
<a class="skip button-sm" href="#list">跳到簡報清單</a>

<nav class="nav" aria-label="網站導覽">
  <a class="brand heading-6" href="./" aria-current="page">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#13865E"/><rect x="7" y="9" width="18" height="12" rx="2" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M16 21v4M12 25h8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    簡報分享
  </a>
  <span class="count caption-3" id="count">0 份</span>
</nav>

<main>
  <section class="hero">
    <div class="eyebrow caption-3"><i></i>互動 HTML 簡報</div>
    <h1 class="heading-1">做好的簡報，<br>都放在這裡</h1>
    <p class="lead body-3">每份都是單一 HTML 檔，點開就能在瀏覽器播放，<br>不用安裝軟體，也不用下載。</p>
    <div class="keys caption-4"><span><kbd>←</kbd><kbd>→</kbd>換頁</span><span><kbd>F</kbd>全螢幕</span><span>手機可左右滑動</span></div>
    <label class="search">
      <svg viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M229.66 218.34l-50.07-50.06a88.11 88.11 0 1 0-11.31 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32ZM40 112a72 72 0 1 1 72 72 72.08 72.08 0 0 1-72-72Z"/></svg>
      <input id="q" type="search" placeholder="搜尋標題或關鍵字" aria-label="搜尋簡報" autocomplete="off">
    </label>
  </section>

  <section aria-label="簡報清單">
    <!-- 新增簡報：在 DECKS 最上面加一筆，最新的放最前面；thumb 是縮圖用第幾頁（預設 2，挑最能代表這份的內容頁） -->
    <div class="grid" id="list"></div>
  </section>
</main>

<footer class="body-6">簡報皆為單一 HTML 檔，可離線播放・本站不提供搜尋引擎收錄</footer>
<div class="toast body-6" id="toast" role="status" aria-live="polite"><svg viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M229.66 77.66l-128 128a8 8 0 0 1-11.32 0l-56-56a8 8 0 0 1 11.32-11.32L96 188.69 218.34 66.34a8 8 0 0 1 11.32 11.32Z"/></svg><span></span></div>

<script>
const DECKS=[
  {date:'2026-12',path:'2026-12-ai-handoff-kit-short',pages:9,thumb:2,title:'AI 工作接力架構｜五分鐘精華版',summary:'12/3 AI 應用工作圈分享。跨電腦、跨 AI 工具，用開工、換手、收工三句口令，讓 AI 接著上次的進度做'},
  {date:'2026-11',path:'2026-11-ai-agent-license',pages:9,thumb:2,title:'AI Agent 進階工具授權採購及管理規劃',summary:'ChatGPT Business 與 Claude Team 組織訂閱的採購、核配與成果分享規劃'},
  {date:'2026-11',path:'2026-11-ai-handoff-kit',pages:21,thumb:4,title:'AI 工作接力架構（完整版）',summary:'跨電腦、跨 AI 工具的工作接力，以 Codex、Claude Code 與 GitHub 為例，附 AI 交接簿建置包'},
  {date:'2026-10',path:'2026-10-rural-ai-practice',pages:22,thumb:2,title:'農村水保署 AI 推動實踐',summary:'2026/10/15 成果發表會簡報'},
];

const $=s=>document.querySelector(s),list=$('#list'),q=$('#q'),toast=$('#toast');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const ICON={
  arrow:'<svg viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M221.66 133.66l-72 72a8 8 0 0 1-11.32-11.32L196.69 136H40a8 8 0 0 1 0-16h156.69l-58.35-58.34a8 8 0 0 1 11.32-11.32l72 72a8 8 0 0 1 0 11.32Z"/></svg>',
  link:'<svg viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M240 88.23a54.43 54.43 0 0 1-16 37L189.25 160a54.27 54.27 0 0 1-38.63 16h-.05A54.63 54.63 0 0 1 96 119.84a8 8 0 0 1 16 .45A38.62 38.62 0 0 0 150.58 160a38.39 38.39 0 0 0 27.31-11.31l34.75-34.75a38.63 38.63 0 0 0-54.63-54.63l-11 11A8 8 0 0 1 135.7 59l11-11a54.65 54.65 0 0 1 77.3 0A54.86 54.86 0 0 1 240 88.23ZM109 185.66l-11 11A38.41 38.41 0 0 1 70.6 208a38.63 38.63 0 0 1-27.29-65.94L78 107.31A38.63 38.63 0 0 1 144 135.71a8 8 0 0 0 16 .45A54.86 54.86 0 0 0 144 96a54.65 54.65 0 0 0-77.27 0L32 130.75A54.62 54.62 0 0 0 70.56 224h.05A54.28 54.28 0 0 0 109.27 208l11-11A8 8 0 0 0 109 185.66Z"/></svg>',
  empty:'<svg viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M216 40H40a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h80v16H96a8 8 0 0 0 0 16h64a8 8 0 0 0 0-16h-24v-16h80a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16Zm0 128H40V56h176v112Z"/></svg>'
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#count').textContent=DECKS.length+' 份';

/* 縮圖：載入簡報的代表頁（預設第 2 頁），直接跳到動畫播完的畫面，等比縮小 */
const ro=new ResizeObserver(es=>es.forEach(e=>{const f=e.target.querySelector('iframe');if(f)f.style.transform='scale('+e.contentRect.width/1920+')'}));
const lazy=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;lazy.unobserve(e.target);
  const t=e.target,f=document.createElement('iframe');f.title='';f.tabIndex=-1;f.setAttribute('aria-hidden','true');f.src=t.dataset.src;
  f.onload=()=>{try{const w=f.contentWindow,d=f.contentDocument;['hint','ui'].forEach(id=>{const e=d.getElementById(id);if(e)e.style.visibility='hidden'});if(w.__deck)w.__deck.show(+t.dataset.page-1,true)}catch(_){}setTimeout(()=>{f.classList.add('ready');t.querySelector('.sk')?.remove()},reduce?0:300)};
  t.appendChild(f);f.style.transform='scale('+t.clientWidth/1920+')';ro.observe(t)}),{rootMargin:'200px'});
const reveal=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');reveal.unobserve(e.target)}}),{threshold:.15});

function render(){
  const k=q.value.trim().toLowerCase(),hit=DECKS.filter(d=>!k||(d.title+d.summary+d.date).toLowerCase().includes(k));
  if(!hit.length){
    list.innerHTML=DECKS.length
      ?'<div class="empty">'+ICON.empty+'<b class="title-1">找不到符合「'+esc(q.value.trim())+'」的簡報</b><span class="body-6">換個關鍵字，或清除搜尋看全部簡報。</span></div>'
      :'<div class="empty">'+ICON.empty+'<b class="title-1">還沒有公開的簡報</b><span class="body-6">新增第一份後就會出現在這裡。</span></div>';
    return}
  list.innerHTML=hit.map((d,i)=>'<article class="card rv" style="transition-delay:'+Math.min(i*60,400)+'ms">'
    +'<div class="thumb" data-src="'+esc(d.path)+'/" data-page="'+(d.thumb||2)+'"><div class="sk"></div></div>'
    +'<div class="body"><div class="meta caption-4"><span>'+esc(d.date)+'</span>'+(d.pages?'<i class="dot"></i><span>'+d.pages+' 頁</span>':'')+'</div>'
    +'<h2 class="title-1"><a class="open" href="'+esc(d.path)+'/">'+esc(d.title)+'</a></h2>'
    +'<p class="body-6">'+esc(d.summary||'')+'</p></div>'
    +'<div class="actions"><span class="go button-sm">開啟簡報'+ICON.arrow+'</span>'
    +'<button class="copy button-sm" type="button" data-path="'+esc(d.path)+'" aria-label="複製「'+esc(d.title)+'」的連結">'+ICON.link+'複製連結</button></div></article>').join('');
  list.querySelectorAll('.thumb').forEach(t=>lazy.observe(t));
  list.querySelectorAll('.rv').forEach(c=>reduce?c.classList.add('in'):reveal.observe(c));
}
let tt;
function say(m,err){toast.querySelector('span').textContent=m;toast.classList.toggle('err',!!err);toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),err?6000:2200)}
function legacyCopy(t){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();return ok}
list.addEventListener('click',async e=>{const b=e.target.closest('.copy');if(!b)return;e.preventDefault();
  const url=new URL(b.dataset.path+'/',location.href).href;
  try{await navigator.clipboard.writeText(url);say('已複製連結')}catch(_){legacyCopy(url)?say('已複製連結'):say('這個瀏覽器不允許自動複製，請手動複製：'+url,true)}});
q.addEventListener('input',render);
render();
</script>
</body>
</html>
